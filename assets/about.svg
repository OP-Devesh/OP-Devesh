<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="496" viewBox="0 0 1200 496" role="img" aria-label="About Devesh, written as a TypeScript object">
<defs>
  <clipPath id="c"><rect width="1200" height="496" rx="22"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="80"/></filter>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .rise,.ln{opacity:1}}

.ln{opacity:0;animation:ln .5s ease-out forwards}
@keyframes ln{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.caret{animation:blink 1.05s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.sweep{animation:sweep 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-360px)}55%,100%{transform:translateX(1200px)}}
.glow{animation:breathe 8s ease-in-out infinite alternate} @keyframes breathe{to{opacity:.12}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="496" fill="#0B0D14"/>
  <circle class="glow" cx="1050" cy="496" r="240" fill="#8B5CF6" opacity=".28" filter="url(#blur)"/>
  <rect width="1200" height="58" fill="#FFFFFF" fill-opacity=".02"/>
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#1C2030"/>
