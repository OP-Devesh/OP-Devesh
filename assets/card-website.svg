<svg xmlns="http://www.w3.org/2000/svg" width="600" height="344" viewBox="0 0 600 344" role="img" aria-label="Website — My playground for the web">
<defs>
  <clipPath id="c"><rect width="600" height="344" rx="22"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="55"/></filter>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .rise,.ln{opacity:1}}

.glow{transform-box:fill-box;transform-origin:center;animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.20;transform:scale(.9)}to{opacity:.42;transform:scale(1.12)}}
.trace{animation:trace 7s linear infinite} @keyframes trace{to{stroke-dashoffset:-100}}
.float{animation:float 5s ease-in-out infinite} @keyframes float{50%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#c)">
  <rect width="600" height="344" fill="#0B0D14"/>
  <circle class="glow" cx="560" cy="20" r="170" fill="url(#a)" filter="url(#blur)"/>
  <text class="sans" x="576" y="322" font-size="150" font-weight="800" fill="#FFFFFF" fill-opacity=".025" text-anchor="end" letter-spacing="-6">04</text>
  <g class="float">
    <rect x="36" y="36" width="64" height="64" rx="18" fill="url(#a)"/>
    <rect x="36" y="36" width="64" height="64" rx="18" fill="none" stroke="#fff" stroke-opacity=".35"/>
    <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="68" cy="68" r="16"/><ellipse cx="68" cy="68" rx="7" ry="16"/><path d="M52 68 H84"/></g>
  </g>
  <g class="rise">
    <rect x="442" y="50" width="126" height="30" rx="15" fill="#60A5FA" fill-opacity=".10" stroke="#60A5FA" stroke-opacity=".35"/>
    <circle class="pulse" cx="460" cy="65" r="4" fill="#60A5FA"/><circle cx="460" cy="65" r="4" fill="#60A5FA"/>
    <text class="mono" x="472" y="69.5" font-size="11.5" letter-spacing="1.6" fill="#60A5FA">MAINTAINED</text>
  </g>
  <text class="mono rise" style="animation-delay:.1s" x="36" y="140" font-size="12" letter-spacing="3" fill="#8B93A7">PROJECT · 04</text>
  <text class="sans rise" style="animation-delay:.18s" x="34" y="180" font-size="32" font-weight="700" letter-spacing="-.8" fill="url(#t)">Website</text>
  <text class="sans rise" style="animation-delay:.26s" x="36" y="210" font-size="16" font-weight="600" fill="#A78BFA">My playground for the web</text>
  <text class="sans rise" style="animation-delay:.34s" font-size="15" fill="#9AA3B5"><tspan x="36" y="242">A hand-styled site where I experiment with</tspan><tspan x="36" y="264">layout, typography and motion.</tspan></text>
  <g class="rise" style="animation-delay:0.50s"><rect x="36" y="282" width="56" height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".10"/><text class="mono" x="64.2" y="301.5" font-size="12.5" fill="#C9D1E0" text-anchor="middle">HTML</text></g><g class="rise" style="animation-delay:0.58s"><rect x="100.4" y="282" width="49" height="30" rx="15" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".10"/><text class="mono" x="124.8" y="301.5" font-size="12.5" fill="#C9D1E0" text-anchor="middle">CSS</text></g>
</g>
<rect x=".75" y=".75" width="598.5" height="342.5" rx="21.25" fill="none" stroke="#1C2030" stroke-width="1.5"/>
<rect class="trace" x=".75" y=".75" width="598.5" height="342.5" rx="21.25" fill="none" stroke="url(#a)" stroke-width="1.6" pathLength="100" stroke-dasharray="14 86" stroke-linecap="round"/>
</svg>