<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Devesh Kumar — developer building desktop apps, games and web experiences">
<defs>
  <clipPath id="c"><rect width="1200" height="460" rx="28"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <radialGradient id="fade" cx=".35" cy=".45" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="m"><rect width="1200" height="460" fill="url(#fade)"/></mask>
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#C7D2FE"/>
    <stop offset=".65" stop-color="#67E8F9"/><stop offset="1" stop-color="#FFFFFF"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="700 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .rise,.ln{opacity:1}}

.blob{transform-box:fill-box;transform-origin:center;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,-40px) scale(1.18)}100%{transform:translate(-70px,35px) scale(.92)}}
.spin{transform-origin:960px 230px;animation:spin 30s linear infinite}
.spin-r{transform-origin:960px 230px;animation:spin 60s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.sweep{animation:sweep 6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-400px)}60%,100%{transform:translateX(1200px)}}
.caret{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
.role{opacity:0;animation:role 14.0s infinite}@keyframes role{0%{opacity:0;transform:translateY(12px)}3.00%{opacity:1;transform:none}21.25%{opacity:1;transform:none}24.25%{opacity:0;transform:translateY(-12px)}100%{opacity:0}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="460" fill="#07080D"/>
  <circle class="blob" cx="260" cy="120" r="200" fill="#8B5CF6" opacity=".40" filter="url(#blur)"/>
  <circle class="blob" style="animation-duration:20s;animation-delay:-7s" cx="900" cy="360" r="220" fill="#22D3EE" opacity=".26" filter="url(#blur)"/>
  <circle class="blob" style="animation-duration:24s;animation-delay:-12s" cx="620" cy="40" r="160" fill="#EC4899" opacity=".16" filter="url(#blur)"/>
  <rect width="1200" height="460" fill="url(#grid)" mask="url(#m)"/>
  <rect class="sweep" x="0" y="0" width="400" height="1.5" fill="url(#edge)"/>

  <!-- status pill -->
  <g class="rise" style="animation-delay:.1s">
    <rect x="80" y="66" width="292" height="36" rx="18" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle class="pulse" cx="102" cy="84" r="4.5" fill="#34D399"/>
    <circle cx="102" cy="84" r="4.5" fill="#34D399"/>
    <text class="mono" x="118" y="88.5" font-size="12" letter-spacing="2.2" fill="#A7F3D0">OPEN TO COLLABORATION</text>
  </g>

  <text class="mono rise" style="animation-delay:.25s" x="82" y="160" font-size="18" fill="#8B93A7">hello, world — I'm</text>
  <text class="sans rise" style="animation-delay:.4s" x="76" y="250" font-size="96" font-weight="800" letter-spacing="-3.5" fill="url(#name)">Devesh Kumar</text>

  <g class="rise" style="animation-delay:.6s">
    <text class="mono" x="82" y="318" font-size="22" fill="#22D3EE">❯</text>
    <text class="role mono" x="112" y="318" font-size="22" fill="#C9D1E0" style="animation-delay:0.0s">building desktop apps with Electron + React</text><text class="role mono" x="112" y="318" font-size="22" fill="#C9D1E0" style="animation-delay:3.5s">crafting games in Godot &amp; GDScript</text><text class="role mono" x="112" y="318" font-size="22" fill="#C9D1E0" style="animation-delay:7.0s">leveling up in Python, one script at a time</text><text class="role mono" x="112" y="318" font-size="22" fill="#C9D1E0" style="animation-delay:10.5s">obsessing over the last 1% of polish</text>
  </g>

  <g class="rise mono" style="animation-delay:.8s" font-size="14" fill="#8B93A7">
    <line x1="82" y1="362" x2="660" y2="362" stroke="#FFFFFF" stroke-opacity=".08"/>
    <text x="82" y="396"><tspan fill="#E6E8EF">@OP-Devesh</tspan><tspan dx="16" fill="#3A4154">/</tspan><tspan dx="16">Desktop · Games · Web</tspan><tspan dx="16" fill="#3A4154">/</tspan><tspan dx="16">Designer's eye, engineer's hands</tspan></text>
  </g>

  <!-- orbit system -->
  <g class="rise" style="animation-delay:.5s">
    <g class="spin-r"><circle cx="960" cy="230" r="150" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-dasharray="2 8"/></g>
    <circle cx="960" cy="230" r="105" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
    <circle cx="960" cy="230" r="60" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-dasharray="1 5"/>
    <g class="spin" style="animation-duration:30s;animation-delay:0s"><circle cx="1110" cy="230" r="5" fill="#22D3EE" filter="url(#glow)"/></g><g class="spin" style="animation-duration:30s;animation-delay:-15s"><circle cx="1110" cy="230" r="4" fill="#F472B6" filter="url(#glow)"/></g><g class="spin" style="animation-duration:18s;animation-delay:-4s"><circle cx="1065" cy="230" r="5" fill="#8B5CF6" filter="url(#glow)"/></g><g class="spin" style="animation-duration:18s;animation-delay:-11s"><circle cx="1065" cy="230" r="3" fill="#22D3EE" filter="url(#glow)"/></g><g class="spin" style="animation-duration:12s;animation-delay:-2s"><circle cx="1020" cy="230" r="3" fill="#FFFFFF" filter="url(#glow)"/></g>
    <g class="float">
      <rect x="916" y="186" width="88" height="88" rx="24" fill="url(#tile)" opacity=".35" filter="url(#blur)"/>
      <rect x="918" y="188" width="84" height="84" rx="22" fill="url(#tile)"/>
      <rect x="918" y="188" width="84" height="84" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".35"/>
      <text class="mono" x="960" y="240" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">&lt;/&gt;</text>
    </g>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>