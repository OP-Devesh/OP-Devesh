<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="Things I'm building">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient>
  <clipPath id="l"><rect x="0" y="125" width="1200" height="3"/></clipPath>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:'JetBrains Mono', 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .rise,.ln{opacity:1}}

.sweep{animation:sweep 5s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1200px)}}
</style>
<g class="rise mono" font-size="14" letter-spacing="4">
  <text x="2" y="40"><tspan fill="#A78BFA">02</tspan><tspan fill="#3A4154" dx="10">——</tspan><tspan fill="#8B93A7" dx="10">SELECTED WORK</tspan></text>
</g>
<text class="sans rise" style="animation-delay:.15s" x="0" y="96" font-size="44" font-weight="700" letter-spacing="-1.2" fill="url(#t)">Things I'm building</text>
<rect x="0" y="126.5" width="1200" height="1" fill="#8B93A7" fill-opacity=".25"/>
<g clip-path="url(#l)"><rect class="sweep" x="0" y="125.5" width="300" height="3" fill="url(#g)"/></g>
</svg>